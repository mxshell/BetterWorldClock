name: Website

# Publishes site/ (plus the icon and previews from docs/) to GitHub Pages:
# https://mxshell.dev/BetterWorldClock/
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/icon.png
      - docs/preview-*.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          mkdir _site
          cp -R site/. _site/
          cp docs/icon.png docs/preview-light.png docs/preview-dark.png _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
